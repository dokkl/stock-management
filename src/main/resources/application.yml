spring:
  application:
    name: stock-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stock}
    username: ${SPRING_DATASOURCE_USERNAME:stock}
    password: ${SPRING_DATASOURCE_PASSWORD:stock}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholders:
      # V11: 공용 AI 키로 남길 관리자(app.admin.kakao-ids와 같은 값)
      admin_kakao_ids: ${ADMIN_KAKAO_IDS:}
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: 카카오
        provider:
          kakao:
            authorization-uri: ${app.kakao.auth-base-url}/oauth/authorize
            token-uri: ${app.kakao.auth-base-url}/oauth/token
            user-info-uri: ${app.kakao.api-base-url}/v2/user/me
            user-name-attribute: id
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: ko_KR
    locale-resolver: fixed
  docker:
    compose:
      lifecycle-management: start-only

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        # HTTPS 없이 운영하면 SESSION_COOKIE_SECURE=false (localhost는 브라우저가 Secure 쿠키를 허용한다)
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  zone: Asia/Seoul
  admin:
    # 관리자 카카오 회원번호(쉼표 구분). 관리자만 AI 설정을 보고 공용 AI 키를 관리한다.
    kakao-ids: ${ADMIN_KAKAO_IDS:}
  kakao:
    auth-base-url: https://kauth.kakao.com
    api-base-url: https://kapi.kakao.com
    admin-key: ${KAKAO_ADMIN_KEY:}
  crypto:
    key: ${APP_CRYPTO_KEY:}
  scheduling:
    enabled: true
  portfolio:
    max-accounts: 2
    max-holdings: 20
  ai:
    timeout: 60s
    models:
      anthropic: claude-sonnet-5-5
      openai: gpt-5
  quote:
    refresh-interval: 30s
    stale-after: 1m
  toss:
    base-url: ${TOSS_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}
    timeout: 10s
  market:
    master-sync-on-startup: true

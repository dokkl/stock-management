spring:
  application:
    name: stock-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stock}
    username: ${SPRING_DATASOURCE_USERNAME:stock}
    password: ${SPRING_DATASOURCE_PASSWORD:stock}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholders:
      # V11: 공용 AI 키로 남길 관리자(app.admin.kakao-ids와 같은 값)
      admin_kakao_ids: ${ADMIN_KAKAO_IDS:}
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: 카카오
        provider:
          kakao:
            authorization-uri: ${app.kakao.auth-base-url}/oauth/authorize
            token-uri: ${app.kakao.auth-base-url}/oauth/token
            user-info-uri: ${app.kakao.api-base-url}/v2/user/me
            user-name-attribute: id
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: ko_KR
    locale-resolver: fixed
  docker:
    compose:
      lifecycle-management: start-only

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        # HTTPS 없이 운영하면 SESSION_COOKIE_SECURE=false (localhost는 브라우저가 Secure 쿠키를 허용한다)
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  zone: Asia/Seoul
  admin:
    # 관리자 카카오 회원번호(쉼표 구분). 관리자만 AI 설정을 보고 공용 AI 키를 관리한다.
    kakao-ids: ${ADMIN_KAKAO_IDS:}
  kakao:
    auth-base-url: https://kauth.kakao.com
    api-base-url: https://kapi.kakao.com
    admin-key: ${KAKAO_ADMIN_KEY:}
  crypto:
    key: ${APP_CRYPTO_KEY:}
  scheduling:
    enabled: true
  portfolio:
    max-accounts: 2
    max-holdings: 20
  ai:
    timeout: 60s
    models:
      anthropic: claude-sonnet-5-5
      openai: gpt-5
  indicator:
    # 003: 국내 지표는 장중 1분, 장 외 30분마다 갱신. 장중 10분 넘게 못 받으면 "지연"
    stale-after: 10m
    closed-interval: 30m
    domestic-check-interval: 1m
    global-interval: 1h
  fred:
    # 003: 미국 지수·WTI·VIX(FRED, 일별 종가). 키가 비어 있으면 갱신하지 않는다
    base-url: ${FRED_BASE_URL:https://api.stlouisfed.org}
    api-key: ${FRED_API_KEY:}
    timeout: 10s
  cboe:
    # 003: S&P 500·VIX 일별 종가 CSV(당일 저녁 갱신, 키 불필요)
    base-url: ${CBOE_BASE_URL:https://cdn-api.cboe.com}
    timeout: 20s
  yahoo:
    # 003: WTI 근월물 선물(비공식). 실패하면 FRED 현물가로 대체
    base-url: ${YAHOO_BASE_URL:https://query1.finance.yahoo.com}
    timeout: 10s
  quote:
    refresh-interval: 30s
    stale-after: 1m
  toss:
    base-url: ${TOSS_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}
    timeout: 10s
    # 운영: 토스 허용 IP가 고정되도록 고정 IP 프록시를 거친다(infra/terraform/egress_proxy.tf). 비어 있으면 직접 호출
    proxy-url: ${TOSS_PROXY_URL:}
  market:
    master-sync-on-startup: true

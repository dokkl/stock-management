<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  가이드 버튼(FR-015, FR-019): 남은 횟수 표시, 한도 소진·거래정지면 비활성과 사유.
  같은 종목의 한도가 바뀌면(guide-quota-changed-{securityId}) 자기 자신을 다시 받아 온다.
-->
<span th:fragment="button(h)" th:id="'guide-btn-' + ${h.id}" class="guide-button"
      th:hx-get="@{/holdings/{id}/guide-button(id=${h.id})}"
      th:hx-trigger="'guide-quota-changed-' + ${h.securityId} + ' from:body'" hx-swap="outerHTML"
      th:with="remaining=${h.guideQuota().remaining()}, reasonId='guide-reason-' + ${h.id}">
    <button type="button" class="btn-link"
            th:hx-post="@{/holdings/{id}/guides(id=${h.id})}" hx-target="#guide-panel" hx-swap="innerHTML"
            th:disabled="${h.guideDisabled()}"
            th:attr="aria-describedby=${h.guideDisabled() ? reasonId : null}"
            th:aria-label="#{guide.button.label(${h.name}, ${remaining})}"
            th:text="#{guide.button(${remaining})}">가이드 (남은 2회)</button>
    <span th:if="${h.guideDisabled()}" th:id="${reasonId}" class="guide-reason">
        <th:block th:if="${h.tradingStatus.name() == 'ACTIVE'}" th:text="#{guide.quota.resetsAt}">내일 00:00 (KST) 초기화</th:block>
        <th:block th:unless="${h.tradingStatus.name() == 'ACTIVE'}" th:text="#{'guide.unavailable.' + ${h.tradingStatus.name()}}">거래정지</th:block>
    </span>
</span>

<th:block th:fragment="button-only">
    <span th:replace="~{:: button(${holding})}"></span>
</th:block>
</body>
</html>

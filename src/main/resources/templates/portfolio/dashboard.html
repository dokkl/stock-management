<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{portfolio.title})}"></head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<header th:replace="~{layout :: header}"></header>
<main id="main">
    <div class="toolbar">
        <h1 th:text="#{portfolio.title}">대시보드</h1>
        <form th:replace="~{portfolio/account-create-form :: create-form(false)}"></form>
    </div>

    <!-- 시세 셀 갱신(FR-012): 30초마다 받아 OOB로 교체한다. 본문은 바꾸지 않는다. -->
    <div id="quote-poller" th:hx-get="@{/fragments/quotes}" hx-trigger="every 30s" hx-swap="none"></div>

    <div id="accounts">
        <div id="accounts-empty" th:if="${dashboard.isEmpty()}">
            <div th:replace="~{fragments/states :: empty('portfolio.empty')}"></div>
        </div>
        <th:block th:each="account : ${dashboard.accounts()}">
            <section th:replace="~{portfolio/account :: account-section(${account})}"></section>
        </th:block>
    </div>
</main>

<!--
  AI 가이드 서랍 패널: 데스크톱은 오른쪽, 모바일은 아래에서 올라오는 시트. 가이드 버튼의 hx-target(#guide-panel)이 안에
  있고, 응답이 들어오면 app.js가 연다. 닫아도 진행 카드는 남아 폴링을 계속하고, 완료되면 토스트로 알린다.
-->
<dialog id="guide-drawer" class="guide-drawer" aria-labelledby="guide-drawer-title">
    <div class="guide-drawer-header">
        <h2 id="guide-drawer-title" th:text="#{guide.drawer.title}">AI 가이드</h2>
        <button type="button" class="btn btn-sm" data-close-drawer th:text="#{guide.drawer.close}">닫기</button>
    </div>
    <div id="guide-panel" class="guide-drawer-body" aria-live="polite"></div>
</dialog>

<!-- 패널이 닫혀 있을 때 가이드 완료를 알리는 토스트(app.js가 복제해 쓴다) -->
<template id="guide-ready-toast">
    <div class="toast toast-action" role="status">
        <span><strong data-guide-name></strong>
            <span data-guide-ok th:text="#{guide.ready.ok}"> 가이드가 준비되었습니다.</span>
            <span data-guide-failed th:text="#{guide.ready.failed}"> 가이드를 받지 못했습니다.</span></span>
        <button type="button" class="btn btn-sm" data-guide-view th:text="#{guide.ready.view}">보기</button>
    </div>
</template>
<th:block th:replace="~{layout :: chrome}"></th:block>

</body>
</html>

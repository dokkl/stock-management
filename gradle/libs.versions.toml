[versions]
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
spring-ai = "2.0.2"
testcontainers = "2.0.5"
archunit = "1.5.1"
playwright = "1.64.0"
axe-playwright = "4.14.0"
wiremock = "3.13.2"
htmx = "2.0.11"
webjars-locator = "1.1.5"
spotless = "8.11.0"
palantir-java-format = "2.103.0"
errorprone-plugin = "5.2.0"
errorprone-core = "2.52.0"
dependency-check = "13.0.0"
checkstyle = "14.4.0"

[libraries]
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
spring-ai-anthropic = { module = "org.springframework.ai:spring-ai-anthropic" }
spring-ai-openai = { module = "org.springframework.ai:spring-ai-openai" }
htmx = { module = "org.webjars.npm:htmx.org", version.ref = "htmx" }
webjars-locator = { module = "org.webjars:webjars-locator-lite", version.ref = "webjars-locator" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
axe-playwright = { module = "com.deque.html.axe-core:playwright", version.ref = "axe-playwright" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependency-check" }

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Quality gates (format, lint, unit, integration, e2e, coverage)
        run: ./gradlew check
      # NVD API 키가 있을 때만 검사한다(키 없이는 NVD 데이터를 받지 못해 항상 실패한다). 있으면 CVSS 7 이상에서 실패.
      - name: Dependency vulnerability scan (CVSS >= 7 fails)
        if: env.NVD_API_KEY != ''
        run: ./gradlew dependencyCheckAnalyze
      - name: Dependency vulnerability scan skipped
        if: env.NVD_API_KEY == ''
        run: echo "::warning::NVD_API_KEY 시크릿이 없어 의존성 취약점 검사를 건너뜁니다(https://nvd.nist.gov/developers/request-an-api-key)."
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
      - name: Terraform validate
        run: |
          for dir in infra/bootstrap infra/terraform; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks GitHub Action은 PR 이벤트에서 추가 권한이 필요해 실패했다. CLI를 직접 실행한다.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock}
      POSTGRES_USER: ${POSTGRES_USER:-stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock}
    ports:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-stock}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stock}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stock}
      # 성능 측정 시 카카오 대역으로 돌린다: APP_KAKAO_AUTH_BASE_URL=http://kakao-stub:8080 등
      APP_KAKAO_AUTH_BASE_URL: ${APP_KAKAO_AUTH_BASE_URL:-https://kauth.kakao.com}
      APP_KAKAO_API_BASE_URL: ${APP_KAKAO_API_BASE_URL:-https://kapi.kakao.com}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  kakao-stub:
    image: wiremock/wiremock:3.13.2
    profiles: [perf]
    command: ["--port", "8080", "--global-response-templating"]
    volumes:
      - ./perf/kakao-stub:/home/wiremock

  k6:
    image: grafana/k6
    profiles: [perf]
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./perf:/scripts
    command: run /scripts/budget.js

volumes:
  db-data:
